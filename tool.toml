name        = "dwarves-kit"
description = "Spec-driven Claude Code workflow with a verification pipeline. Worker > task-verifier > fix-agent retry, by default. Bash-first (every script readable in 30 seconds). Hook-enforced safety. Ships both as a Claude Code plugin and as a bash installer for older environments."
language    = "bash"
status      = "stable"
entry       = "install.sh"
created     = 2026-03-29
version     = "2.2.0"

# Consumer repos: any Dwarves project that adopts the spec-driven flow.
# Not bound to a specific repo; the kit is per-machine, not per-project.
consumers   = []

# Runtime: Claude Code (>= v2.0.60 for custom subagents). Distributed via Claude
# Code plugin marketplace (recommended) or bash installer (alternative).
systems     = ["claude-code"]

# No secrets used by the kit itself. Hooks read tool calls and project state;
# they do not authenticate to any external service. Logs land on local disk only.
secrets     = []

# Hard dependencies. Bash installer requires all three; plugin install relies on
# Claude Code's plugin runtime providing the same shell semantics.
depends_on  = ["jq", "git", "bash"]
